<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 근처 병원 & 약국 지도</title>
  <!-- 카카오맵 API 불러오기 (services 라이브러리 포함) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY&libraries=services"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Malgun Gothic', dotum, sans-serif;
    }
    #container {
      display: flex;
      width: 100%;
      height: 100vh;
    }
    /* 왼쪽 사이드바 스타일 */
    #sidebar {
      width: 350px;
      height: 100%;
      background: #f8f9fa;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    /* 탭 버튼 영역 */
    .tab-group {
      display: flex;
      background: #e9ecef;
    }
    .tab-btn {
      flex: 1;
      padding: 15px 10px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #e03131;
      border-bottom: 3px solid #e03131;
    }
    .tab-btn#tab-pharmacy.active {
      color: #2f9e44;
      border-bottom-color: #2f9e44;
    }
    /* 검색 결과 리스트 영역 */
    #place-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 10px;
    }
    .place-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #ffffff;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .place-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      border-color: #adb5bd;
    }
    .place-title {
      font-size: 15px;
      font-weight: bold;
      color: #212529;
      margin-bottom: 4px;
    }
    .place-address {
      font-size: 13px;
      color: #868e96;
    }
    .place-category {
      font-size: 11px;
      color: #adb5bd;
      margin-top: 4px;
    }
    /* 지도 영역 */
    #map {
      flex: 1;
      height: 100%;
    }
    /* 인포윈도우 스타일 */
    .info-window {
      padding: 10px;
      font-size: 12px;
      color: #333;
      min-width: 160px;
      line-height: 1.4;
    }
    .info-window strong {
      display: block;
      font-size: 13px;
      color: #000;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

  <div id="container">
    <!-- 왼쪽 사이드바 -->
    <div id="sidebar">
      <div class="tab-group">
        <button class="tab-btn active" id="tab-hospital" onclick="changeCategory('HP8')">학교 근처 병원</button>
        <button class="tab-btn" id="tab-pharmacy" onclick="changeCategory('PM9')">병원 근처 약국</button>
      </div>
      <ul id="place-list"></ul>
    </div>

    <!-- 지도 표시 영역 -->
    <div id="map"></div>
  </div>

  <script>
    // 기본 중심 좌표 (접속 실패 시 기본 위치)
    let currentPosition = new kakao.maps.LatLng(37.566826, 126.978656);
    let map;
    let placeSearchService;
    let markers = [];
    let activeInfoWindow = null;
    let currentCategory = 'HP8'; // 기본값: 병원(HP8)

    // 안정적인 카카오 및 아이콘 마커 URL 설정
    // 병원: 빨간색 핀 마커 이미지
    const hospitalIconUrl = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png';
    // 약국: 초록색/기본 카카오 장소 스프라이트 마커
    const pharmacyIconUrl = 'https://t1.daumcdn.net/mapjsapi/images/2x/marker_green.png';

    // 페이지 로드 시 초기화
    window.onload = function() {
      const mapContainer = document.getElementById('map');
      const mapOptions = {
        center: currentPosition,
        level: 4
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, mapOptions);

      // 카카오 장소 검색 객체 생성
      placeSearchService = new kakao.maps.services.Places();

      // 현재 위치 추출 (기능 1: 현재 위치 표시)
      getUserLocation();
    };

    // 사용자 위치 추출 및 내 위치 마커 표시
    function getUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentPosition = new kakao.maps.LatLng(lat, lng);

            map.setCenter(currentPosition);

            // 내 위치 마커 (별 아이콘)
            const myLocationMarkerImage = new kakao.maps.MarkerImage(
              'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png', 
              new kakao.maps.Size(24, 35)
            );

            const myLocationMarker = new kakao.maps.Marker({
              position: currentPosition,
              map: map,
              image: myLocationMarkerImage,
              title: '내 위치'
            });

            // 내 위치 팝업
            const myInfoWindow = new kakao.maps.InfoWindow({
              content: '<div class="info-window"><strong>📍 현재 위치</strong></div>'
            });

            kakao.maps.event.addListener(myLocationMarker, 'click', function() {
              if (activeInfoWindow) activeInfoWindow.close();
              myInfoWindow.open(map, myLocationMarker);
              activeInfoWindow = myInfoWindow;
            });

            // 내 위치 기준 초기 검색 수행
            searchCategoryPlaces(currentCategory);
          },
          function(error) {
            console.warn('Geolocation 불러오기 실패, 기본 위치 사용:', error.message);
            searchCategoryPlaces(currentCategory);
          }
        );
      } else {
        alert('이 브라우저는 GeoLocation을 지원하지 않습니다.');
        searchCategoryPlaces(currentCategory);
      }
    }

    // 탭 클릭 시 카테고리 변경 처리
    function changeCategory(categoryCode) {
      if (currentCategory === categoryCode) return;

      currentCategory = categoryCode;

      // 탭 버튼 스타일 전환
      document.getElementById('tab-hospital').classList.toggle('active', categoryCode === 'HP8');
      document.getElementById('tab-pharmacy').classList.toggle('active', categoryCode === 'PM9');

      // 카테고리 장소 검색 실행
      searchCategoryPlaces(categoryCode);
    }

    // 카테고리 검색 서비스 실행
    function searchCategoryPlaces(categoryCode) {
      // 1. 기존 데이터 초기화
      clearPreviousData();

      // 2. 카카오 카테고리 검색
      placeSearchService.categorySearch(categoryCode, searchPlacesCallback, {
        location: currentPosition,
        radius: 2000,
        sort: kakao.maps.services.SortBy.DISTANCE
      });
    }

    // 검색 결과 콜백 함수
    function searchPlacesCallback(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        displayPlacesAndMarkers(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('주변에 검색된 장소가 없습니다.');
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('장소 검색 중 오류가 발생했습니다.');
      }
    }

    // 결과 목록 및 마커 출력
    function displayPlacesAndMarkers(places) {
      const listContainer = document.getElementById('place-list');
      const bounds = new kakao.maps.LatLngBounds();

      bounds.extend(currentPosition);

      places.forEach(function(place) {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 1. 마커 생성
        const marker = createMarker(placePosition, place);
        markers.push(marker);

        // 2. 리스트 생성
        const listItem = createListItem(place, marker);
        listContainer.appendChild(listItem);

        bounds.extend(placePosition);
      });

      map.setBounds(bounds);
    }

    // 카테고리별 마커 이미지 생성
    function createMarker(position, place) {
      // HP8(병원) = 빨간 마커, PM9(약국) = 초록 마커
      const iconUrl = (currentCategory === 'HP8') ? hospitalIconUrl : pharmacyIconUrl;

      // 카카오 맵 이미지 크기 및 앵커 포인트 설정
      const markerSize = new kakao.maps.Size(29, 42);
      const markerOption = { offset: new kakao.maps.Point(14, 42) };

      const markerImage = new kakao.maps.MarkerImage(iconUrl, markerSize, markerOption);

      const marker = new kakao.maps.Marker({
        position: position,
        map: map,
        image: markerImage
      });

      // 마커 클릭 시 상세 팝업 표시
      const address = place.road_address_name ? place.road_address_name : place.address_name;
      const content = `
        <div class="info-window">
          <strong>${place.place_name}</strong>
          <span>${address}</span>
        </div>
      `;

      const infoWindow = new kakao.maps.InfoWindow({
        content: content,
        removable: true
      });

      kakao.maps.event.addListener(marker, 'click', function() {
        if (activeInfoWindow) activeInfoWindow.close();
        infoWindow.open(map, marker);
        activeInfoWindow = infoWindow;
      });

      return marker;
    }

    // 왼쪽 사이드바 리스트 아이템 생성
    function createListItem(place, marker) {
      const li = document.createElement('li');
      li.className = 'place-item';

      const address = place.road_address_name ? place.road_address_name : place.address_name;

      li.innerHTML = `
        <div class="place-title">${place.place_name}</div>
        <div class="place-address">${address}</div>
        <div class="place-category">${place.category_name}</div>
      `;

      li.onclick = function() {
        map.panTo(marker.getPosition());
        kakao.maps.event.trigger(marker, 'click');
      };

      return li;
    }

    // 기존 데이터 지우기
    function clearPreviousData() {
      markers.forEach(function(marker) {
        marker.setMap(null);
      });
      markers = [];

      if (activeInfoWindow) {
        activeInfoWindow.close();
        activeInfoWindow = null;
      }

      const listContainer = document.getElementById('place-list');
      listContainer.innerHTML = '';
    }
  </script>
</body>
</html>
