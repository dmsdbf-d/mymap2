<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    
    <!-- 카카오 지도 JavaScript SDK (autoload=false로 설정하여 안전하게 로드) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cc18b4217cde2ab98c34c83af3b0e01b&libraries=services&autoload=false"></script>
    
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 전체 화면 2분할 레이아웃 */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽: 검색창 및 결과 리스트 영역 (400px 고정) */
        .sidebar {
            width: 380px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        /* 검색창 영역 */
        .search-box {
            padding: 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }

        .search-box h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #fbd300; /* 카카오 노란색 액센트 */
        }

        .search-btn {
            padding: 10px 16px;
            background-color: #fee500; /* 카카오 시그니처 컬러 */
            border: none;
            border-radius: 6px;
            font-weight: bold;
            color: #191919;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: #fada00;
        }

        /* 검색 결과 리스트 영역 */
        .result-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .place-item {
            padding: 12px 15px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .place-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border-color: #ffe812;
        }

        .place-name {
            font-size: 15px;
            font-weight: bold;
            color: #212529;
            margin-bottom: 4px;
        }

        .place-address {
            font-size: 13px;
            color: #6c757d;
        }

        .place-phone {
            font-size: 12px;
            color: #007bff;
            margin-top: 4px;
        }

        /* 오른쪽: 지도 영역 (남은 화면 전체 차지) */
        .map-area {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 결과가 없을 때 메시지 */
        .no-result {
            text-align: center;
            color: #868e96;
            margin-top: 50px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 왼쪽: 검색창 및 리스트 -->
        <div class="sidebar">
            <div class="search-box">
                <h2>📍 장소 검색</h2>
                <div class="input-group">
                    <input type="text" id="keywordInput" class="search-input" placeholder="검색할 장소를 입력하세요 (예: 카페)" onkeydown="if(event.key === 'Enter') searchPlaces()">
                    <button class="search-btn" onclick="searchPlaces()">검색</button>
                </div>
            </div>
            <div id="resultList" class="result-list">
                <div class="no-result">검색어를 입력하고 검색 버튼을 눌러주세요.</div>
            </div>
        </div>

        <!-- 오른쪽: 지도 영역 -->
        <div class="map-area">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // 전역 변수 선언
        let map; // 지도 객체
        let ps;  // 장소 검색 객체
        let infowindow; // 마커 클릭 시 나타날 정보창
        let markers = []; // 생성된 마커 배열

        // 카카오 지도 SDK가 정상적으로 완료된 후 실행 (로딩 오류 방지)
        kakao.maps.load(function() {
            initMap();
        });

        // 지도 및 서비스 초기화 함수
        function initMap() {
            const mapContainer = document.getElementById('map');
            
            // 기본 중심 좌표 (위치 권한을 거부했을 경우 대비용 - 서울시청 기본값)
            const defaultCenter = new kakao.maps.LatLng(37.566826, 126.978656);
            
            const mapOptions = {
                center: defaultCenter,
                level: 5 // 확대 레벨 설정 (요구사항: 5)
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);

            // 장소 검색 서비스 객체 생성
            ps = new kakao.maps.services.Places();

            // 정보창 객체 생성
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 사용자 현재 위치 가져오기 (HTML5 Geolocation)
            getCurrentLocation();
        }

        // 현재 위치를 받아와 지도의 중심을 이동시키는 함수
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;  // 위도
                        const lon = position.coords.longitude; // 경도
                        
                        const currentLatLng = new kakao.maps.LatLng(lat, lon);

                        // 지도 중심을 현재 위치로 이동
                        map.setCenter(currentLatLng);

                        // 현재 위치에 표시할 마커 생성
                        const myLocationMarker = new kakao.maps.Marker({
                            position: currentLatLng,
                            map: map
                        });

                        // 현재 위치 안내 정보창
                        const locationInfowindow = new kakao.maps.InfoWindow({
                            content: '<div style="padding:5px;font-size:12px;">📍 현재 위치</div>'
                        });
                        locationInfowindow.open(map, myLocationMarker);
                    },
                    function(error) {
                        console.warn('위치 정보를 가져오는 데 실패했습니다. 기본 위치를 사용합니다.', error);
                    }
                );
            } else {
                alert('이 브라우저에서는 위치 서비스(Geolocation)를 지원하지 않습니다.');
            }
        }

        // 키워드 검색 실행 함수
        function searchPlaces() {
            const keyword = document.getElementById('keywordInput').value.trim();

            if (!keyword) {
                alert('검색어를 입력해 주세요!');
                return;
            }

            // 카카오 장소 검색 API 호출 (현재 지도 중심을 기준으로 검색)
            ps.keywordSearch(keyword, placesSearchCB, {
                location: map.getCenter()
            });
        }

        // 장소 검색 완료 시 호출되는 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 검색 결과 목록 및 지도 마커 표시
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
                clearResults();
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 및 마커를 화면에 출력하는 함수
        function displayPlaces(places) {
            const listElement = document.getElementById('resultList');
            
            // 기존 마커 및 리스트 초기화
            clearResults();

            // 검색된 장소들의 위치를 포함하는 경계 객체 생성 (지도 자동 범위 조절용)
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                
                // 마커 생성 및 지도에 표시
                const marker = addMarker(placePosition);
                
                // 검색된 장소 위치를 범위 객체에 추가
                bounds.extend(placePosition);

                // 리스트 아이템 HTML 생성
                const itemElement = document.createElement('div');
                itemElement.className = 'place-item';
                itemElement.innerHTML = `
                    <div class="place-name">${index + 1}. ${place.place_name}</div>
                    <div class="place-address">${place.road_address_name || place.address_name}</div>
                    ${place.phone ? `<div class="place-phone">📞 ${place.phone}</div>` : ''}
                `;

                // 리스트 아이템 클릭 시 지도 이동 및 정보창 표시
                itemElement.onclick = function() {
                    map.panTo(placePosition); // 부드럽게 위치 이동
                    displayInfowindow(marker, place.place_name);
                };

                // 마커 클릭 이벤트 설정
                kakao.maps.event.addListener(marker, 'click', function() {
                    displayInfowindow(marker, place.place_name);
                });

                listElement.appendChild(itemElement);
            });

            // 검색 결과 위치들이 모두 보이도록 지도 범위 재설정
            map.setBounds(bounds);
        }

        // 마커 생성 함수
        function addMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });
            markers.push(marker); // 마커 지우기 관리를 위해 배열에 보관
            return marker;
        }

        // 마커 위에 장소 이름 정보창(InfoWindow)을 띄우는 함수
        function displayInfowindow(marker, title) {
            const content = `<div style="padding:8px 12px;font-size:13px;font-weight:bold;color:#333;">${title}</div>`;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }

        // 이전 검색 결과 및 마커 제거 함수
        function clearResults() {
            // 지도 위 모든 마커 제거
            markers.forEach(marker => marker.setMap(null));
            markers = [];

            // 리스트 초기화
            document.getElementById('resultList').innerHTML = '';
            
            // 정보창 닫기
            if (infowindow) {
                infowindow.close();
            }
        }
    </script>
</body>
</html>
